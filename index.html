<head>

<style>
:root{--bg:#f2f7f7;--cd:#fff;--tx:#10262b;--mu:#46606a;--ac:#0f766e;--ax:#fff;--bd:#c5d5d8;--ok:#14532d;--okb:#dcfce7;--dm:#78350f;--dmb:#fef3c7;--sos:#7f1d1d;--sosb:#fee2e2}
[data-theme=dark]{--bg:#0b1517;--cd:#13262a;--tx:#e9f3f4;--mu:#a6bdc1;--ac:#2dd4bf;--ax:#042f2e;--bd:#2b4348;--ok:#86efac;--okb:#12301d;--dm:#fcd34d;--dmb:#3b2a08;--sos:#fca5a5;--sosb:#471313}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:88px}
.skip{position:absolute;left:12px;top:8px;z-index:20;transform:translateY(-160%);background:var(--ac);color:var(--ax);padding:8px 16px;border-radius:12px;font-weight:700;text-decoration:none}
.skip:focus{transform:none}
.top{position:sticky;top:0;z-index:5}
main{max-width:640px;margin:0 auto;padding:12px 14px}
header{background:var(--cd);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:6px 14px}
.disc{font-size:13px;line-height:1.35;padding:8px 14px;text-align:center;background:var(--dmb);color:var(--dm);border-bottom:1px solid var(--bd)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;word-break:break-word}
.scroll table{width:100%;min-width:0}
.w{font-size:20px;font-weight:700;color:var(--ac);text-decoration:none;display:flex;gap:8px;align-items:center;min-height:48px}.w small{font-weight:400;color:var(--mu);font-size:16px}
h1{font-size:22px;margin:8px 0 12px}h2{font-size:18px;margin:16px 0 8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 2px 8px rgba(0,0,0,.14)}
button,.b{min-height:48px;padding:0 16px;border-radius:12px;border:2px solid var(--ac);background:var(--ac);color:var(--ax);font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:background .15s}
.g{background:transparent;color:var(--ac)}.full{width:100%}
a{color:var(--ac)}:focus-visible{outline:3px solid var(--dm);outline-offset:2px}
input,select,textarea{width:100%;min-height:48px;font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}textarea{min-height:96px}
label.f{display:block;margin:10px 0 4px;font-weight:600}
.chip{display:inline-flex;gap:4px;align-items:center;border-radius:99px;padding:2px 10px;font-size:14px;font-weight:700;margin:0 4px 2px 0;border:1px solid var(--bd)}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.dm{background:var(--dmb);color:var(--dm)}.chip.sos{background:var(--sosb);color:var(--sos)}
.ban{border-radius:14px;padding:12px;margin:0 0 12px;font-weight:600;border-left:8px solid}.ban.sos{background:var(--sosb);color:var(--sos);border-color:var(--sos)}.ban.dm{background:var(--dmb);color:var(--dm);border-color:var(--dm)}
.row{display:flex;gap:12px;align-items:center;min-height:56px;padding:8px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.row input{width:28px;min-height:28px;height:28px;flex:none;accent-color:var(--ac)}.done span{text-decoration:line-through;color:var(--mu)}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.t{min-height:76px;flex-direction:column;background:var(--cd);color:var(--tx);border-color:var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.14)}.t span{font-size:26px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;text-decoration:none;color:var(--mu);gap:2px}nav a span{font-size:22px}nav a[aria-current]{color:var(--ac);font-weight:700;box-shadow:inset 0 3px 0 var(--ac)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
details summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.pv{position:relative;overflow:hidden;max-width:100%}
.pv table{table-layout:fixed}
.pv th{width:62%}
.pv td{width:38%;overflow-wrap:break-word}
.wm{display:none;position:absolute;left:0;right:0;top:62%;bottom:2%;overflow:hidden;place-items:center;pointer-events:none;font-size:clamp(16px,6vw,32px);font-weight:800;color:rgba(180,40,40,.16);text-align:center;background:transparent}
.wm span{display:block;transform:rotate(-30deg);max-width:90%;padding:12px}
.pv .wm{display:grid}
small{color:var(--mu)}
@media print{
header,nav,.np,.skip,.top{display:none!important}
html,body{background:#fff;color:#000;padding:0;margin:0;width:100%;overflow-x:hidden}
body{padding-bottom:0}
main{max-width:none;margin:0;padding:10mm;overflow:visible}
.top{position:static}
.disc{position:static;background:#fff;color:#000;border:0;padding:0 0 8px}
.pv{overflow:hidden;width:100%;max-width:100%}
.pv table{width:100%;max-width:100%;table-layout:fixed}
.pv th,.pv td{overflow-wrap:anywhere;word-break:break-word}
.pv .wm{color:rgba(160,0,0,.18)!important;background:transparent!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function Fixes(){return <><h1>Fix It</h1>{Object.entries(FX).map(([id,f])=><a key={id} href={'#'+id} className="b g full" style={{marginBottom:10,justifyContent:'flex-start'}}>{f[0]}</a>)}<Src t="Document 04"/></>}
function FixD({id}){const f=FX[id];return <><p><a href="#fixit">‹ Fix It</a></p><h1>{f[0]}</h1><div className="c"><ol style={{paddingLeft:22,margin:0}}>{f[1].map((t,i)=><li key={i} style={{margin:'8px 0'}}><Step t={t}/></li>)}</ol></div><div className="ban dm"><S k="dm">Duty Manager</S> Get the Duty Manager (ext. 201) now if: {f[2]}.</div><Src t="Document 04"/></>}
function Cocktails(){return <><h1>Cocktails</h1><div className="ban dm"><S k="dm">RSA</S> Measure every pour with a jigger. Do not serve anyone you believe is intoxicated or without acceptable ID. Get the Duty Manager (Document 02).</div>{CO.map(c=><details className="c" key={c[0]}><summary>{c[0]}</summary><p><b>Glass:</b> {c[1]}<br/><b>Ice:</b> {c[2]}</p><p><b>Method:</b></p><ol style={{paddingLeft:22,margin:'0 0 8px'}}>{c[3].map((s,i)=><li key={i}>{s}</li>)}</ol><p><b>Specs:</b> {c[4]}<br/><b>Garnish:</b> {c[5]}</p></details>)}<Src t="Document 03"/></>}
function Doc({id,title,groups,sos,sum}){
 const[d,setD]=useLS('lk_'+id,{}),[lg,setLg]=useLS('lk_'+id+'_log',[]),[st,setSt]=useState(0),[pv,setPv]=useState(false);

 if(pv)return <div className="pv"><div className="wm" aria-hidden="true"><span>Draft – Duty Manager to sign</span></div><p className="disc">Demonstration app for a fictional venue. The Lakeside Hotel is not a real hotel.</p><h1>{title}</h1><p><b>Draft – Duty Manager to review and sign before this is filed.</b></p><table><tbody>{F.map(f=><tr key={f[0]}><th>{f[1]}</th><td>{f[2]=='y'&&d[f[0]]?d[f[0]]:v(f[0])}</td></tr>)}</tbody></table><p>Duty Manager: ______________ Signature: ______________ Date/time: ________</p><div className="np"><button onClick={()=>window.print()}>Print</button> <button className="g" onClick={()=>setPv(false)}>Edit</button> <button className="g" onClick={save}>Save to log</button></div></div>;
 return <><h1>{title}</h1>{sos&&<div className="ban sos"><S k="sos">Call 000</S> If anyone is hurt or in danger, call 000 first, then get the Duty Manager (ext. 201). Do the report later.</div>}
 {groups.length>1&&<p>Step {stSafe+1} of {n}: <b>{g[0]}</b></p>}
 <div className="c">{g[1].map(([k,l,t])=><div key={k}><label className="f" htmlFor={id+k}>{l}</label>{t=='a'?<textarea id={id+k} placeholder="not provided" value={d[k]||''} onChange={e=>setD({...d,[k]:e.target.value})}/>:t=='y'?<select id={id+k} value={d[k]||''} onChange={e=>setD({...d,[k]:e.target.value})}><option value="">not provided</option><option>Yes</option><option>No</option></select>:<input id={id+k} placeholder="not provided" value={d[k]||''} onChange={e=>setD({...d,[k]:e.target.value})}/>}</div>)}</div>
 <div className="grid">{stSafe>0?<button className="g" onClick={()=>setSt(stSafe-1)}>Back</button>:<span/>}<button onClick={()=>last?setPv(true):setSt(stSafe+1)}>{last?'Preview and print':'Next'}</button></div>
 <button className="g full" onClick={()=>confirm('Clear this draft?')&&(setD({}),restart())}>Clear draft</button>
 {lg.length>0&&<h2>Saved drafts</h2>}{lg.map((e,i)=><div className="c" key={i}><b>{e.s}</b><br/><small>{e.at}</small><br/><S k={e.ok?'ok':'dm'}>{e.ok?'Reviewed':'Needs Duty Manager review'}</S><div className="grid"><button className="g" onClick={()=>setLg(lg.map((x,j)=>j==i?{...x,ok:!x.ok}:x))}>{e.ok?'Reopen':'Duty Manager reviewed'}</button><button className="g" onClick={()=>confirm('Delete this draft?')&&setLg(lg.filter((_,j)=>j!=i))}>Delete</button></div></div>)}
 <Src t={id=='inc'?'Document 09 (draft only; Duty Manager decides the register)':'Document 11'}/></>}
function Quiz({sess,setSess}){
 const[so,setSo]=useLS('lk_so',[]);
 const{di,qi,ans,pk,nm,ini,sv}=sess,set=p=>setSess(s=>({...s,...p})),reset=()=>setSess(Q0);
 const qs=di!=null&&QZ[di]?QZ[di][1]:[],cur=qs[qi],fin=di!=null&&qs.length>0&&qi>=qs.length,sc=qs.reduce((n,q,i)=>n+(ans[i]==q[2]?1:0),0),pass=sc>=4;
 useEffect(()=>{if(di!=null&&!QZ[di])reset()},[di]);
 const save=()=>{setSo([...so,{n:nm,d:today(),doc:QZ[di][0],sc,r:pass?'Pass':'Retake',i:ini}]);set({sv:true})};
 return <><h1>Quiz</h1>
 {di==null&&<>{QZ.map((q,i)=><button key={i} className="g full" style={{marginBottom:10,justifyContent:'flex-start'}} onClick={()=>setSess({...Q0,di:i})}>{q[0]}</button>)}<small>Pass mark 4 out of 5 (80%).</small></>}
 {di!=null&&!fin&&cur&&<div className="c"><p><b>{QZ[di][0]}</b> · Question {qi+1} of {qs.length}</p><p>{cur[0]}</p>{cur[1].map((o,i)=><button key={i} className="g full" style={{marginBottom:8,justifyContent:'flex-start',textAlign:'left'}} disabled={pk!=null} onClick={()=>set({pk:i})}>{'ABCD'[i]}. {o}</button>)}
 {pk!=null&&<><p>{pk==cur[2]?<S k="ok">Right</S>:<S k="sos">Wrong</S>} Answer: {cur[1][cur[2]]}</p><button className="full" onClick={()=>set({ans:[...ans,pk],pk:null,qi:qi+1})}>{qi==qs.length-1?'See score':'Next question'}</button></>}</div>}
 {di!=null&&!fin&&!cur&&<div className="c"><p>This quiz could not be shown.</p><button className="full" onClick={reset}>Start again</button></div>}
 {fin&&<><div className="c"><h2>Result: {sc} out of 5 ({sc*20}%)</h2>{pass?<S k="ok">Pass</S>:<S k="dm">Retake with the Duty Manager (ext. 201)</S>}{!pass&&<p>Re-read the sections you missed in {QZ[di][0]} first.</p>}
 <table><tbody>{qs.map((q,i)=><tr key={i}><td>{i+1}. {q[0]}</td><td>{ans[i]==q[2]?<S k="ok">Right</S>:<S k="sos">Wrong</S>}</td></tr>)}</tbody></table></div>
 <div className="c"><b>Sign-off record</b> (Duty Manager initials every pass)<label className="f" htmlFor="qn">Staff name</label><input id="qn" value={nm} onChange={e=>set({nm:e.target.value})}/><label className="f" htmlFor="qi">Duty Manager initials</label><input id="qi" value={ini} onChange={e=>set({ini:e.target.value})}/><p><button className="full" disabled={!nm||sv} onClick={save}>{sv?'Saved':'Save sign-off'}</button></p></div>
 <button className="g full" onClick={()=>setSess({...Q0,di})}>Start again</button>
 <button className="g full" onClick={reset}>Back to quiz list</button></>}
 {so.length>0&&<><h2>Sign-off table</h2><div style={{overflowX:'auto'}}><table><thead><tr><th>Name</th><th>Date</th><th>Document</th><th>Score</th><th>Result</th><th>Initials</th></tr></thead><tbody>{so.map((r,i)=><tr key={i}><td>{r.n}</td><td>{r.d}</td><td>{r.doc.slice(0,11)}</td><td>{r.sc}/5</td><td>{r.r}</td><td>{r.i||'not provided'}</td></tr>)}</tbody></table></div><p><button onClick={()=>csv('quiz-signoff.csv',[['Staff name','Date','Document','Score (out of 5)','Pass / Retake','Duty Manager initials'],...so.map(r=>[r.n,r.d,r.doc,r.sc,r.r,r.i])])}>Export CSV</button></p></>}
 <Src t="Document 07"/></>}
function Gaps(){const[g,setG]=useLS('lk_gap',[]),[f,setF]=useState({date:today(),q:'',who:'',area:'other',fix:'',owner:'',st:'Open'}),[fl,setFl]=useState('All');const ST=['Open','In progress','Fixed','Not needed'],set=k=>e=>setF({...f,[k]:e.target.value});
 return <><h1>Gap log</h1><p>Log a question the assistant could not answer. No passwords, codes or guest details.</p><div className="c"><label className="f" htmlFor="gd">Date</label><input id="gd" type="date" value={f.date} onChange={set('date')}/><label className="f" htmlFor="gq">Question</label><textarea id="gq" value={f.q} onChange={set('q')}/><label className="f" htmlFor="gw">Who asked (role, not name)</label><input id="gw" value={f.who} onChange={set('who')}/><label className="f" htmlFor="ga">Area</label><select id="ga" value={f.area} onChange={set('area')}>{['bar','gaming','kitchen','tech','RSA','other'].map(a=><option key={a}>{a}</option>)}</select><label className="f" htmlFor="gf">Suggested fix (document to write or update)</label><input id="gf" value={f.fix} onChange={set('fix')}/><label className="f" htmlFor="go">Owner</label><input id="go" value={f.owner} onChange={set('owner')}/><label className="f" htmlFor="gs">Status</label><select id="gs" value={f.st} onChange={set('st')}>{ST.map(a=><option key={a}>{a}</option>)}</select><p><button className="full" disabled={!f.q} onClick={()=>{setG([f,...g]);setF({...f,q:'',fix:''})}}>Add to log</button></p></div>
 <label className="f" htmlFor="gl">Filter by status</label><select id="gl" value={fl} onChange={e=>setFl(e.target.value)}>{['All',...ST].map(a=><option key={a}>{a}</option>)}</select>
 {g.map((e,i)=>({e,i})).filter(x=>fl=='All'||x.e.st==fl).map(({e,i})=><div className="c" key={i}><small>{e.date} · {e.area}</small><br/>{e.q}<br/><small>Asked by: {e.who||'not provided'} · Owner: {e.owner||'not provided'} · Fix: {e.fix||'not provided'}</small><label className="f" htmlFor={'s'+i}>Status</label><select id={'s'+i} value={e.st} onChange={x=>setG(g.map((y,j)=>j==i?{...y,st:x.target.value}:y))}>{ST.map(a=><option key={a}>{a}</option>)}</select></div>)}
 <p><button disabled={!g.length} onClick={()=>csv('gap-log.csv',[['Date','Question','Who asked','Area','Suggested fix','Owner','Status'],...g.map(e=>[e.date,e.q,e.who||'not provided',e.area,e.fix,e.owner||'not provided',e.st])])}>Export CSV</button></p><Src t="Document 08"/></>}
const PH=[["Bar","Draught lager keg","keg"],["Bar","House red wine","bottle"],["Bar","House vodka","700 ml"],["Bar","Mixers and juices","bottle"],["Bar","Garnishes and fresh citrus","each"],["Cellar","Draught pale ale keg","keg"],["Cellar","Packaged beer and cider","case"],["Cellar","Spare spirits","bottle"],["Cellar","Soft drink","case"],["Kitchen dry store","Cooking oil","bottle"],["Kitchen dry store","Paper napkins","pack"],["Kitchen dry store","Cleaning supplies","pack"]].map(([a,p,u])=>({a,p,u,par:'',on:''}));

 return <><h1>Stock count</h1><div className="ban dm"><S k="dm">Manager</S> Manager checks and sends the order. Kitchen stock is counted by the Head Chef (ext. 202). Product names are examples only. Product and par to be set by the manager — no invented prices.</div>
 {list.map((x,i)=><div className="c" key={i}><small>{x.a}</small><label className="f" htmlFor={'p'+i}>Product</label><input id={'p'+i} value={x.p} onChange={e=>up(i,'p',e.target.value)}/><div className="grid"><div><label className="f" htmlFor={'u'+i}>Unit</label><input id={'u'+i} value={x.u} placeholder="e.g. keg" onChange={e=>up(i,'u',e.target.value)}/></div><div><label className="f" htmlFor={'r'+i}>Par</label><input id={'r'+i} type="number" min="0" value={x.par} placeholder="par not set" onChange={e=>up(i,'par',e.target.value)}/></div></div><label className="f" htmlFor={'o'+i}>On hand</label><input id={'o'+i} type="number" min="0" step="any" value={x.on} placeholder="not counted" onChange={e=>up(i,'on',e.target.value)}/></div>)}
 <button className="g full" onClick={()=>setR([...list,{a:'Bar',p:'',u:'',par:'',on:''}])}>Add a row</button>

 <button onClick={()=>csv('order-draft.csv',[['Area','Product','Unit','On hand','Par','Order qty','Flag'],...rows.map(x=>[x.a,x.p,x.u,x.on,x.par,x.fl?'':x.sh,x.fl])])}>Export CSV</button><Src t="Document 12"/></>}

const QR=[["opening-bar","Opening: bar","Bar"],["closing-bar","Closing: bar","Bar"],["cocktails","Cocktail specs","Back bar"],["eftpos","EFTPOS fault","Till area"],["pos","POS fault","Till area"],["printer","Printer fault","Till area"],["kitchen-printer","Kitchen printer fault","Kitchen pass"],["opening-kitchen","Kitchen open","Kitchen pass"],["closing-kitchen","Kitchen close","Kitchen pass"],["opening-gaming","Gaming open","Gaming station (staff side)"],["closing-gaming","Gaming close","Gaming station (staff side)"],["stock","Stock count","Cellar"],["incident","Incident draft","Office"],["handover","Handover","Office"],["gaps","Gap log","Office"],["quiz","Quiz and sign-off","Staff room"]];

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
