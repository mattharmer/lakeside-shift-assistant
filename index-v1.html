<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lakeside Shift Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--navy:#0a1630;--panel:#122247;--panel2:#1a2e5c;--line:#2a4078;--gold:#d9aa48;--goldd:#a8812c;--text:#eef1f8;--mut:#a9b5d1;--ok:#5fcf8f;--bad:#ff8a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--text);font:17px/1.45 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 30px}
header{padding:6px 2px 12px}

.tabs button{min-height:56px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;font:600 15px "Source Sans 3",sans-serif;cursor:pointer;padding:4px}
.tabs button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h3{font-size:19px;color:var(--gold);margin-bottom:8px}
.seg{display:flex;gap:8px;margin:12px 0}
.btn{min-height:54px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:700 17px "Source Sans 3",sans-serif;cursor:pointer;text-align:left}
.btn.gold{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.btn.ghost{background:transparent}
.seg .btn{flex:1;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.grid2 .btn{min-height:72px;text-align:center}
.bar{height:16px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.pl{display:flex;justify-content:space-between;color:var(--mut);margin:6px 0 4px;font-weight:600}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;min-height:54px}
.item:first-of-type{border-top:0}
.item input{width:28px;height:28px;accent-color:var(--gold);flex:none;margin-top:1px}
.item.done span{color:var(--mut);text-decoration:line-through}
.note{color:var(--mut);font-size:15px;margin:0 0 6px}
.big{font-size:21px;font-weight:600;margin:6px 0 14px}
.call{border:2px solid var(--gold);background:#1c2a52;border-radius:12px;padding:14px;margin:12px 0}
.call b{color:var(--gold)}
.good{border:2px solid var(--ok);border-radius:12px;padding:14px;margin:12px 0;background:#10301f}
.alert{border:2px solid var(--bad);border-radius:12px;padding:12px 14px;margin:12px 0;background:#3a1a22}
ol,ul{margin:6px 0;padding-left:24px}
li{margin:7px 0}
.say{border-left:4px solid var(--gold);padding:4px 12px;margin:10px 0;font-style:italic;color:#fff}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=search],input[type=datetime-local],textarea,select{width:100%;min-height:50px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--navy);color:var(--text);font:17px "Source Sans 3",sans-serif}
textarea{min-height:90px}
.sum{white-space:pre-wrap;background:var(--navy);border:1px dashed var(--goldd);border-radius:10px;padding:12px;font-size:16px;margin:10px 0}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:0 6px 4px 0;font-size:14px;color:var(--mut)}
.k{color:var(--gold);font-weight:700}
footer{margin-top:24px;text-align:center;color:var(--mut);font-size:14px}
@media(max-width:520px){.tabs{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const DM="Check with Duty Manager (ext. 201)";

function useStored(key,init){
  const [v,setV]=useState(()=>{try{const s=localStorage.getItem(key);return s?JSON.parse(s):init}catch(e){return init}});
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(v))}catch(e){}},[key,v]);
  return [v,setV];
}

/* ---------- Doc 01 ---------- */
const CL={
open:[
{t:"Duty Manager",items:["Arrive 30–45 min before doors. Disarm alarm. If it won’t disarm, stay outside and call the security contractor","Lights and computers on. Walk the whole venue for damage, leaks, unsecured doors","Fire exits clear, exit lights on. First-aid kit and spill kit in place","Open safe, prepare till floats as per the float sheet","Power on POS, receipt and kitchen printers, EFTPOS. Confirm each is online","Check bookings diary, function sheet, last night’s notes","Brief the team: bookings, 86’d items, maintenance, banned or caution patrons","Unlock public doors at the advertised opening time, not before"]},
{t:"Bar",items:["Clean uniform and name badge. Wash hands","Check and restock beer, wine, spirits, softs. Tell the Duty Manager if anything is out","Run beer lines if due on the line-clean schedule. Check first pours","Cut garnishes, fill ice wells, set up glassware and cocktail mise en place","Glasswasher has salt and rinse aid, running a clean cycle","Wipe and set bar tops, stools, tables, beer garden","RSA signage displayed. Incident register is in the office","Count bar float (second person if possible), sign the sheet, load the till","Confirm POS and EFTPOS work. Tell the Duty Manager the bar is ready"]},
{t:"Gaming room (current RCG only, under the Duty Manager)",items:["Unlock room. Lights and air-conditioning on","Entry, responsible gambling signage and clocks visible","Power on machines and monitoring connection","Walk each machine: no error lights, screens on, note acceptors clear","Cash-box area secure. No keys left in machines","Confirm gaming float and payout process with the Duty Manager","Self-exclusion folder in the office. Never discuss an exclusion with patrons","Gambling incident register available. Open only when the floor is supervised","Tell the Duty Manager the gaming room is open"]},

],
close:[
{t:"Kitchen handover",items:["Confirm food last-orders time with the Duty Manager","Finish tickets. Printer stays on until the Duty Manager confirms none pending","Cool, cover, label and date leftovers. Record discards","Break down pass and cook line. Complete the close-down list","Shut down cooking equipment in order. Fryers left safe","Record cool-room and freezer temps again. Doors latched","Rubbish and recycling out. Dock door not left open","Write handover notes and give them to the Duty Manager in person","Last kitchen staff leave only after the kitchen is checked and locked"]},
{t:"Bar and floor",items:["Last drinks called 15 min before close, per the licence. No liquor after licensed hours","Finish outstanding tabs","Clear and wash glassware. Clean ice wells, soda guns, pour mats. Wipe surfaces","Restock fridges and rotate stock","Glasswasher empty cycle, off, door ajar","Clean amenities, dining room, beer garden, bar floor","Lost property tagged with date and place, left in the office","Check beer garden, car park entry and amenities for remaining patrons"]},
{t:"Gaming room",items:["Announce closing clearly. Politely ask patrons to leave","Don’t pay disputed amounts without the Duty Manager","When empty, walk all machines. Note errors or damage","Machines off or in the overnight state set by the Duty Manager","Secure cash-box keys and gaming float with the Duty Manager","Record any gambling incidents in the gambling incident register","Lights and air-conditioning off as posted. Lock room, return keys","Tell the Duty Manager the room is closed and secured"]},
{t:"Cash-up and tills",items:["Close floor to new sales. Complete or transfer open tabs","Run the Z-report on every till. Don’t skip a terminal","Take drawer to the office. Never count cash on the bar","Count, separate float, bag takings, complete the cash-up sheet","Variance over the sheet limit or unexplained: recount once, tell the Duty Manager. Don’t alter POS reports","Record comps, staff meals, walkouts. Attach dockets","Takings and float in the safe. Duty Manager confirms it is locked","Lock or power down POS and EFTPOS as posted","Sign and date the cash-up sheet. Duty Manager countersigns"]},
{t:"Security lock-up",items:["All patrons gone. Check amenities, beer garden, function rooms, gaming room","Windows, fire exits, dock doors, bottle-shop door, main entry secure","Non-essential lights, heaters, music off. Security and exit lights stay on","CCTV recorder keeps running. Don’t unplug it","Lock office, bottle store, spirit store, gaming room, kitchen as posted","Final walk: cigarettes, smouldering bins, running taps, appliances","Verbal headcount. Nobody left locked inside","Set alarm from the office panel. Leave by staff door and check it is locked","Alarm won’t arm: find the open zone, fix if safe or call the security contractor. Stay until secure"]},
{t:"End-of-night report (Duty Manager)",items:["Date, shift, name, trading hours actually used","Trade summary and any functions","Cash-up result for each till, EFTPOS, variance, safe locked","Staff who closed, late finishes, staff incidents","Refusals, evictions, injuries, police or security, register entry numbers","Equipment faults and stock issues / 86’d items","First jobs for the morning team. Kitchen handover attached","Notes on banned or caution patrons","Serious incident: phone the Licensee or Approved Manager before leaving"]}
]};

function Checklist(){
  const [shift,setShift]=useState("open");
  const [chk,setChk]=useStored("lsa-chk",{});
  const [arm,setArm]=useState(false);
  const secs=CL[shift];
  const ids=secs.flatMap((s,i)=>s.items.map((_,j)=>shift+i+"-"+j));
  const n=ids.filter(id=>chk[id]).length, pct=Math.round(100*n/ids.length);
  const toggle=id=>setChk({...chk,[id]:!chk[id]});
  const reset=()=>{if(!arm){setArm(true);setTimeout(()=>setArm(false),3000);return}
    const c={...chk};ids.forEach(id=>delete c[id]);setChk(c);setArm(false)};
  return <div>
    <div className="seg">
      <button className={"btn "+(shift==="open"?"gold":"")} onClick={()=>setShift("open")}>Opening</button>
      <button className={"btn "+(shift==="close"?"gold":"")} onClick={()=>setShift("close")}>Closing</button>
    </div>
    <div className="pl"><span>{n} of {ids.length} done</span><span>{pct}%</span></div>
    <div className="bar" role="progressbar" aria-valuenow={pct} aria-valuemin="0" aria-valuemax="100"><i style={{width:pct+"%"}}></i></div>
    {secs.map((s,i)=><div className="card" key={shift+i}>
      <h3>{s.t}</h3>
      {s.items.map((it,j)=>{const id=shift+i+"-"+j;return <label className={"item "+(chk[id]?"done":"")} key={id}>
        <input type="checkbox" checked={!!chk[id]} onChange={()=>toggle(id)}/><span>{it}</span></label>})}
    </div>)}
    <button className="btn ghost" style={{width:"100%",textAlign:"center",borderColor:arm?"var(--bad)":"var(--line)"}} onClick={reset}>{arm?"Tap again to reset "+(shift==="open"?"opening":"closing"):"Reset shift"}</button>
    <p className="note" style={{marginTop:10}}>Short form of Document 01. Tell the Duty Manager (ext. 201) about anything that can’t be done. Don’t skip a safety, cash or lock-up step to finish faster.</p>
  </div>;
}

/* ---------- Doc 04 ---------- */
const FIX={
eftpos:{label:"EFTPOS",steps:[
{t:"Is the terminal on with the screen lit, and the cable seated at both ends (if it sits on a base)?"},
{t:"Is there paper in the terminal and the cover closed? A paper error can look like a failed sale."},

{t:"If it uses Wi-Fi or mobile: do other terminals or staff phones nearby have signal?",alt:{l:"Nothing has signal",go:"wifi"}},
{t:"Restart the EFTPOS terminal only: power off, wait 30 seconds, power on, wait until idle. Try one test sale. Did it work?"},
{t:"Try a different EFTPOS terminal, another bar or the office terminal. Did the sale go through?"}],
end:["Payments may need to go cash-only. The Duty Manager decides on a backup terminal or cash-only.","Don’t keep retrying a card. Don’t reboot the network yourself.","Terminal damaged or card stuck: stop using it, put an “out of order” note on it."],

end:["Only the Duty Manager restarts network gear. Don’t do it yourself.","Backup plan: cash-only if cards are down; handwritten or walked tickets to the kitchen (ext. 202); note every sale for later entry.","The Duty Manager calls IT support from the office contact list. Staff don’t ring IT unless asked.","Don’t factory-reset anything. Don’t share the Wi-Fi admin login."],
esc:"A network restart is needed, all POS or EFTPOS are down, or kitchen tickets have stopped."},

{t:"Is the printer powered and the power point on?"},

{t:"Check the cable from printer to POS (or the network cable if it’s a network printer). Is it seated?"},

end:["Write the order or amount on a notepad and give a handwritten receipt if the guest needs one.","Don’t keep sending the same print job. It may all come out at once.","Kitchen printer not getting orders? Phone the kitchen on ext. 202, tell them tickets may be missing and walk numbered dockets to the pass."],
esc:"Kitchen tickets have stopped, a function is in progress, or the fault lasts more than a few minutes in busy trade."},

{t:"Does the screen have power? Check the wall point and whether it’s on standby."},
{t:"Is it on the right input (HDMI 1, HDMI 2, AV)? Check the label on the bezel or remote caddy. Is there a picture now?"},
{t:"Is the set-top or sports box on and looking normal? If frozen, restart that device and wait for it to boot. Fixed?"},

end:["Get the Duty Manager if a ladder or the AV cupboard is needed. Don’t pull leads to “see what happens”.","Several screens down: the Duty Manager checks the main AV rack or splitter.","Screen used for gaming-room or statutory signage: tell the Duty Manager straight away.","Race, match or function coming up? Tell the Duty Manager early so a backup can be tried."],
esc:"You would need a ladder, a password, or to open the AV rack."}

function Fix(){
  const [p,setP]=useState(null);
  const [i,setI]=useState(0);
  const [res,setRes]=useState(null);
  const start=k=>{setP(k);setI(0);setRes(null)};
  if(!p) return <div>
    <p className="big">What’s not working?</p>
    <div className="grid2">{Object.keys(FIX).map(k=><button key={k} className="btn" onClick={()=>start(k)}>{FIX[k].label}</button>)}</div>
    <div className="card"><h3>Don’t wait, call now</h3>
      <ul><li>Payments down everywhere, or a guest may be double-charged</li><li>Kitchen tickets stopped</li><li>A sale may be missing</li><li>A password, ladder or network restart is needed</li></ul>
      <p>Duty Manager: <b className="k">ext. 201</b> · Kitchen: <b className="k">ext. 202</b></p>
      <p className="note">Never guess passwords, safe codes or router logins. Document 04.</p></div>
  </div>;
  const f=FIX[p], s=f.steps[i];
  return <div>
    <p className="note">{f.label} · Document 04</p>
    {res==="fixed"&&<div className="good"><h3 style={{color:"var(--ok)"}}>Fixed</h3><p>Note the fault for the end-of-night report. If it comes back, start again.</p></div>}
    {res==="call"&&<div>
      <div className="call"><h3>Get the Duty Manager now</h3><p className="big" style={{margin:"4px 0"}}>Ext. <b>201</b></p>
        <p>Say what you can see, what you’ve tried, and which terminal, printer or screen it is.</p></div>
      <div className="card"><ul>{f.end.map((e,k)=><li key={k}>{e}</li>)}</ul></div>
      <div className="alert"><b>Escalate now: </b>{f.esc}</div></div>}
    {!res&&<div className="card">
      <p className="note">Step {i+1} of {f.steps.length}</p>
      <p className="big">{s.t}</p>
      <div className="seg"><button className="btn gold" onClick={()=>setRes("fixed")}>Yes, fixed</button>
        <button className="btn" onClick={()=>i+1<f.steps.length?setI(i+1):setRes("call")}>No</button></div>
      {s.alt&&<button className="btn ghost" style={{width:"100%"}} onClick={()=>start(s.alt.go)}>{s.alt.l}: go to Wi-Fi / network</button>}
    </div>}
    <div className="seg"><button className="btn ghost" onClick={()=>setP(null)}>Pick another problem</button>
      {!res&&i>0&&<button className="btn ghost" onClick={()=>setI(i-1)}>Back</button>}
      {res&&<button className="btn ghost" onClick={()=>start(p)}>Start again</button>}</div>
  </div>;
}

const LOCS=["Main bar","Public bar","Dining room","Beer garden","Gaming room","Entry / door","Car park","Amenities"];

function Incident(){
  const [k,setK]=useState(null);
  const blank={when:"",loc:"",who:"",what:"",act:"",out:"",police:"No",wit:"",staff:"",dm:"Yes"};
  const [f,setF]=useState(blank);
  const [copied,setCopied]=useState(false);
  const set=(a,v)=>setF({...f,[a]:v});
  const d=k&&INC[k];
  const summary=useMemo(()=>k?[
    "INCIDENT SUMMARY – The Lakeside Hotel",
    "Type: "+d.label,
    "Date/time: "+(f.when?f.when.replace("T"," "):"Not recorded"),
    "Location: "+(f.loc||"Not recorded"),
    "People involved: "+(f.who||"Not recorded"),
    "What happened: "+(f.what||"Not recorded"),
    "Action taken: "+(f.act||"Not recorded"),
    "Outcome: "+(f.out||"Not recorded"),
    "Police: "+f.police,
    "Witnesses: "+(f.wit||"None recorded"),
    "Duty Manager informed: "+f.dm,
    "Entry made by: "+(f.staff||"Not recorded"),
    "Copy into the register within 24 hours."].join("\n"):"",[k,f]);
  const copy=()=>{
    const done=()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)};
    try{navigator.clipboard.writeText(summary).then(done,fb)}catch(e){fb()}
    function fb(){const t=document.createElement("textarea");t.value=summary;document.body.appendChild(t);t.select();try{document.execCommand("copy");done()}catch(e){}t.remove()}
  };
  if(!k) return <div>
    <p className="big">What’s happening?</p>
    <div className="grid2">{Object.keys(INC).map(x=><button key={x} className="btn" onClick={()=>setK(x)}>{INC[x].label}</button>)}</div>
    <div className="call"><b>000</b> straight away for violence or serious threat, a weapon, someone unconscious or badly injured, suspected sexual assault, or if you can’t contain it safely.<br/><br/>Then get the <b>Duty Manager: ext. 201</b>.</div>
  </div>;
  return <div>
    <p className="note">{d.doc}</p>
    <div className="call"><b>Get the Duty Manager now: ext. 201.</b> Don’t guess. If unsure, stop and ask.</div>
    <div className="card"><h3>{d.label}: steps</h3><ol>{d.steps.map((s,i)=><li key={i}>{s}</li>)}</ol>
      {d.say.map((s,i)=><div className="say" key={i}>{s}</div>)}
      <p className="note">{d.note}</p></div>
    <div className="card"><h3>Incident log summary</h3>
      <p className="note">Builds text to copy. It doesn’t replace the register entry.</p>
      <label className="f">Date and time</label><input type="datetime-local" value={f.when} onChange={e=>set("when",e.target.value)}/>
      <label className="f">Location</label><select value={f.loc} onChange={e=>set("loc",e.target.value)}><option value="">Choose…</option>{LOCS.map(l=><option key={l}>{l}</option>)}</select>
      <label className="f">People involved (names or descriptions)</label><textarea value={f.who} onChange={e=>set("who",e.target.value)}/>
      <label className="f">What happened</label><textarea value={f.what} onChange={e=>set("what",e.target.value)}/>
      <label className="f">Action taken</label><textarea value={f.act} onChange={e=>set("act",e.target.value)}/>
      <label className="f">Outcome</label><textarea value={f.out} onChange={e=>set("out",e.target.value)}/>
      <label className="f">Police</label><select value={f.police} onChange={e=>set("police",e.target.value)}><option>No</option><option>Notified</option><option>Attended</option></select>
      <label className="f">Witnesses</label><input type="text" value={f.wit} onChange={e=>set("wit",e.target.value)}/>
      <label className="f">Duty Manager informed</label><select value={f.dm} onChange={e=>set("dm",e.target.value)}><option>Yes</option><option>Not yet</option></select>
      <label className="f">Your name</label><input type="text" value={f.staff} onChange={e=>set("staff",e.target.value)}/>
      <div className="sum">{summary}</div>
      <button className="btn gold" style={{width:"100%",textAlign:"center"}} onClick={copy}>{copied?"Copied":"Copy summary"}</button>
    </div>
    <button className="btn ghost" onClick={()=>setK(null)}>Pick another situation</button>
  </div>;
}

/* ---------- Doc 03 ---------- */
const CK=[
{n:"Margarita",g:"Coupe (straight up) or rocks. Ask the guest.",i:"Cubed ice for shaking. Fresh ice in the glass if on the rocks.",s:["50 ml blanco tequila","25 ml triple sec","25 ml fresh lime juice","10 ml sugar syrup, only if the lime is very sharp"],m:["Salt a half rim only if the guest asks","Shake hard with ice","Fine-strain (over fresh ice if on the rocks)"],ga:"Lime wheel or lime wedge"},
{n:"Espresso Martini",g:"Coupe",i:"Cubed ice for shaking only. Serve straight up.",s:["50 ml vodka","25 ml coffee liqueur","30 ml fresh espresso","10 ml sugar syrup"],m:["Pull a fresh short espresso, let it sit a moment","Shake very hard with ice","Fine-strain. Top should have thick crema"],ga:"Three coffee beans on the crema"},
{n:"Mojito",g:"Highball",i:"Crushed ice",s:["50 ml white rum","25 ml fresh lime juice","15 ml sugar syrup","8–10 mint leaves","Soda water, to top"],m:["Mint, lime juice, syrup in glass. Press gently, don’t shred","Add rum, fill with crushed ice, churn","Top with soda and a little more crushed ice"],ga:"Mint sprig and a lime wedge"},
{n:"Negroni",g:"Rocks",i:"One large cube, or fresh cubed ice",s:["30 ml gin","30 ml Campari","30 ml sweet vermouth"],m:["Stir with ice until cold","Strain over fresh ice"],ga:"Orange peel: express the oils over the drink and drop it in"},
{n:"Old Fashioned",g:"Rocks",i:"One large cube",s:["60 ml bourbon or rye (ask the guest’s preference)","10 ml sugar syrup or 1 sugar cube","2 dashes Angostura bitters"],m:["Stir with ice until cold and slightly diluted","Strain over a large cube","Sugar cube: muddle with bitters and a dash of water first, then add whisky and stir"],ga:"Orange peel, oils expressed over the drink. Cherry optional"},
{n:"Aperol Spritz",g:"Wine glass",i:"Cubed ice, built in the glass",s:["90 ml prosecco","60 ml Aperol","30 ml soda water"],m:["Fill glass with cubed ice","Add prosecco, then Aperol, then soda","Stir gently once"],ga:"Orange slice"},
{n:"Cosmopolitan",g:"Coupe",i:"Cubed ice for shaking only. Serve straight up.",s:["45 ml citrus vodka","15 ml triple sec","30 ml cranberry juice","15 ml fresh lime juice"],m:["Shake hard with ice","Fine-strain into the glass"],ga:"Orange peel or a lime wheel"},
{n:"Daiquiri",g:"Coupe",i:"Cubed ice for shaking only. Serve straight up.",s:["60 ml white rum","25 ml fresh lime juice","15 ml sugar syrup"],m:["Shake hard with ice","Fine-strain into the glass"],ga:"Lime wheel (optional)"},
{n:"Whisky Sour",g:"Rocks, or coupe if the guest wants it straight up",i:"Cubed ice. Fresh ice in the rocks glass.",s:["50 ml bourbon or rye","25 ml fresh lemon juice","15 ml sugar syrup","15 ml egg white (optional, ask the guest)","2 dashes Angostura bitters (optional, on top)"],m:["Ask about egg white. If yes, dry-shake first (no ice), then shake hard with ice. If no, skip the dry shake","Strain over fresh ice, or fine-strain into a coupe","Bitters on the foam are optional"],ga:"Lemon wheel and/or a cherry",warn:"Contains egg if used. Tell the guest, no egg for an egg allergy, and note the allergen on the ticket."},
{n:"Piña Colada",g:"Hurricane, or a large highball if hurricane glasses are out",i:"Cubed ice, blended (shaken if the blender is down)",s:["50 ml white rum","75 ml pineapple juice","50 ml coconut cream","10 ml fresh lime juice"],m:["Blend all with a scoop of ice until smooth","Blender out of service: shake hard with ice and dump into the glass","Pour into the glass"],ga:"Pineapple wedge and a cherry. Serve with a straw"}
];

function Cocktails(){
  const [q,setQ]=useState("");
  const L=q.trim().toLowerCase();
  const list=CK.filter(c=>!L||(c.n+" "+c.s.join(" ")+" "+c.g).toLowerCase().includes(L));
  return <div>
    <input type="search" placeholder="Search name or ingredient, e.g. rum" value={q} onChange={e=>setQ(e.target.value)} aria-label="Search cocktails"/>
    <p className="note" style={{marginTop:10}}>Document 03. Measure every pour with a jigger. Fresh citrus, 1:1 sugar syrup. No house twists or substitutions unless a supervisor approves. RSA still applies. Stuck? Ask the Bar Supervisor or Duty Manager (ext. 201).</p>
    {list.length===0&&<div className="card">No match. Try another word, or ask the Bar Supervisor.</div>}
    {list.map(c=><div className="card" key={c.n}>
      <h3>{c.n}</h3>
      <span className="tag">{c.g}</span>
      {c.warn&&<div className="alert">{c.warn}</div>}
      <p style={{margin:"6px 0"}}><span className="k">Ice: </span>{c.i}</p>
      <p className="k" style={{margin:"8px 0 0"}}>Specs</p><ul>{c.s.map((x,i)=><li key={i}>{x}</li>)}</ul>
      <p className="k" style={{margin:"8px 0 0"}}>Method</p><ol>{c.m.map((x,i)=><li key={i}>{x}</li>)}</ol>
      <p style={{margin:"6px 0 0"}}><span className="k">Garnish: </span>{c.ga}</p>
    </div>)}
  </div>;
}

/* ---------- App ---------- */
const TABS=[["Shift Checklist",Checklist],["Fix It",Fix],["Incident Help",Incident],["Cocktail Specs",Cocktails]];
function App(){
  const [t,setT]=useState(0);
  const Cmp=TABS[t][1];
  return <div className="wrap">
    <header><h1>Lakeside Shift Assistant</h1><p>The Lakeside Hotel · Lake Macquarie. Duty Manager ext. 201 · Kitchen ext. 202 · Gaming ext. 203</p></header>
    <nav className="tabs">{TABS.map((x,i)=><button key={x[0]} className={i===t?"on":""} onClick={()=>setT(i)}>{x[0]}</button>)}</nav>
    <main><Cmp/></main>
    <footer>Built with Claude from venue documents – always follow your Duty Manager.</footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
